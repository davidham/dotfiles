- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.prompt: .prompt
    ~/.exports: .exports
    ~/.aliases: .aliases
    ~/.functions: .functions
    ~/.extra: .extra
    ~/.secrets: .secrets
    ~/.path: .path
    ~/.editorconfig: .editorconfig
    ~/.gitconfig: .gitconfig
    ~/.zshrc:
      path: .zshrc
      force: true

# - create:
#     - ~/downloads
#     - ~/.vim/undo-history

- shell:
  - [git submodule update --init --recursive, Installing submodules]

